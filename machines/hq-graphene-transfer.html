}

.form-check {

  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);

    border-color 150ms,

}

  height: 100%;

  pointer-events: none;
}

  cursor: not-allowed;
}
